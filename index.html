<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3485">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Okuma Halkası">
<title>Okuma Halkası</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap">
<style>
/* VOICE: sakin, saygılı, az renk, bol hava — her gün açılan bir vird defteri
   IDEA: İznik çinisi ve tezhipli cüz kesesi; lâcivert zemin, turkuaz çizgi; halka sohbeti
   PICTURE: günün okumalarıyla dolan sekiz köşeli yıldız (rozet)
   COLOUR and TYPE: lâcivert #1d3485 baskın, turkuaz #12a5a0 destek, mercan #d9534f keskin vurgu; Amiri başlık, Literata metin
   LAYOUT: tek sütun, telefon önce; bant hero, altında Bugün / Halka / Kitaplar */
:root{color-scheme:light dark;
--bg:light-dark(#f5f7fb,#0a0f1f);--paper:light-dark(#ffffff,#121a33);--ink:light-dark(#141a2a,#e8ecf6);
--muted:light-dark(#5a6378,#9aa5c0);--line:light-dark(#e1e6f0,#24305a);
--lapis:#1d3485;--lapis2:light-dark(#1d3485,#9db4ff);--turq:light-dark(#0f8f8a,#3fd2ca);--coral:#d9534f;
--soft:light-dark(#eef2fb,#18224a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Literata,Amiri,Georgia,serif;overflow-x:clip}
h1,h2,h3{font-family:Amiri,Georgia,serif;font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:28px}h3{font-size:21px}
a{color:inherit}
button,select,input,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:8px 14px}
button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
.primary{background:var(--lapis);color:#fff;border-color:var(--lapis);font-weight:600}
.done{background:var(--turq);border-color:var(--turq);color:#fff}
.wrap{max-width:680px;margin:0 auto;padding:0 max(4vw,16px)}
.hero{background:var(--lapis);color:#fff;padding:28px 0 26px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.hero h1{font-size:clamp(34px,8vw,48px)}
.hero p{margin:6px 0 0;opacity:.85;font-size:15px}
.rosette{width:clamp(112px,30vw,168px);height:clamp(112px,30vw,168px)}
section{padding:26px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;display:block;text-decoration:none}
.card:hover{border-color:var(--turq)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--lapis2);font-family:Literata,serif;font-weight:600}
.ex{margin:8px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none;border:2px solid var(--paper)}
.avs{display:flex}.avs .av+.av{margin-left:-8px}
.state{margin-left:auto;font-size:14px;font-weight:600}
.ok{color:var(--turq)}.no{color:var(--coral)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.book{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:6px;min-height:150px}
.book h3{font-size:19px}.book small{color:var(--muted);font-size:13px}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:auto}.bar i{display:block;height:100%;background:var(--turq)}
.members{display:grid;gap:8px}
.mem{display:flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.mem b{font-weight:600}.mem .cnt{margin-left:auto;font-size:14px;color:var(--muted)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;gap:8px;align-items:center;min-height:56px}
.back{border:0;background:none;padding:6px 8px;display:flex;gap:6px;align-items:center;color:var(--lapis2);font-weight:600}
.list a{display:flex;gap:12px;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.num{font-family:Amiri,serif;font-size:22px;color:var(--lapis2);width:2.2em;flex:none;text-align:right;line-height:1.2}
.list .t{flex:1;color:var(--ink)}.list .t div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.here{font-size:12px;color:var(--coral);font-weight:700}
.text{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,5vw,30px);font-size:19px;line-height:1.8;margin-top:16px}
.text p{margin:0 0 1em}.text p:last-child{margin:0}
.text [dir=rtl]{font-family:Amiri,serif;font-size:26px;line-height:2}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tools select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:0 10px}
.big{width:100%;font-size:18px;min-height:54px;margin:6px 0 4px}
.qs{counter-reset:q;list-style:none;padding:0;margin:12px 0 0}
.qs li{counter-increment:q;display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.qs li::before{content:counter(q);font-family:Amiri,serif;font-size:30px;line-height:1;color:var(--turq);text-align:center}
.note{background:var(--soft);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:16px}
.note b{font-size:14px;display:block;color:var(--lapis2)}
textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper);min-height:96px;resize:vertical}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--paper);margin:4px 0}
.pn{display:flex;justify-content:space-between;gap:8px;margin:22px 0 40px}
.msg{font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:9;max-width:90vw}
.empty{text-align:center;color:var(--muted);padding:24px 10px;border:1px dashed var(--line);border-radius:18px}
fieldset{border:1px solid var(--line);border-radius:14px;margin:12px 0;padding:10px 14px}
label{display:flex;gap:8px;align-items:center;min-height:40px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{font-size:14px}.chips .on{background:var(--soft);border-color:var(--lapis2);color:var(--lapis2);font-weight:600}
@media(prefers-reduced-motion:no-preference){.petal{transition:fill .5s}}
.slot{background:var(--lapis);color:#fff;border-radius:20px;padding:22px 16px;text-align:center;margin:14px 0}
.slot small{display:block;opacity:.8;font-size:14px}
.slot b{display:block;font-family:Amiri,serif;font-size:clamp(40px,12vw,60px);line-height:1.15;margin-top:4px}
.slot.spin b{opacity:.75}
.people{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.people button{display:flex;gap:8px;align-items:center;border-radius:99px;padding:6px 14px 6px 6px}
.people .on{border-color:var(--turq);background:var(--soft);font-weight:600}
.people .off{opacity:.55}
.qa{list-style:none;padding:0;margin:12px 0 0}
.qa li{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.qa li .who{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--lapis2);margin-bottom:6px}
.step{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:18px 0 6px}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--lapis2);font-weight:700}
.step.cur i{background:var(--turq);color:#fff}
.urow{display:flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px}
.urow b{flex:1}
.small{font-size:14px;min-height:40px}
</style>
<style>
.hero{padding-top:calc(28px + env(safe-area-inset-top))}
.top{padding-top:env(safe-area-inset-top)}
.me{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.me select{min-height:40px;border-radius:10px;border:0;padding:0 8px;background:rgba(255,255,255,.14);color:#fff}
.me select option{color:#141a2a}
.qa li.mine{border-color:var(--turq);box-shadow:0 0 0 2px var(--turq) inset}
.demo{background:#fff4d6;color:#5a4300;padding:10px 14px;font-size:14px}
.ayet{font-family:'Amiri Quran',Amiri,serif;font-size:27px;line-height:2.3;text-align:justify;margin:0}
.ayet .no{font-family:Amiri,serif;color:var(--turq);font-size:22px;white-space:nowrap}
.emb{display:inline-grid;place-items:center;min-width:56px;height:56px;padding:0 10px;border-radius:14px;color:#fff;font-family:'Amiri Quran',Amiri,serif;font-size:22px;line-height:1;margin-bottom:6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}.emb.big{min-width:64px;height:64px;font-size:24px;margin:0 12px 0 0;background:var(--lapis)!important}.cat:first-child .emb.big{background:rgba(255,255,255,.14)!important}
.dua{padding:12px 0;border-bottom:1px solid var(--line)}.dua:last-child{border:0}.okunus{font-style:italic;color:var(--muted);font-size:16px;margin:6px 0 0}.meal1{margin:6px 0 0;font-size:17px}
.meal p{margin:0 0 .7em}.meal b{color:var(--lapis2)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin:12px 0}
.seg button{flex:1;border:0;background:none;min-height:40px}.seg .on{background:var(--paper);font-weight:700;color:var(--lapis2);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.srow{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.srow .arn{font-family:Amiri,serif;font-size:20px;color:var(--lapis2)}
.srow small{display:block;color:var(--muted);font-size:13px}
.cats{display:grid;gap:12px}.cat{display:block;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}
.cat:first-child{background:var(--lapis);color:#fff;border-color:var(--lapis)}.cat:first-child .msg{color:#dfe6ff}
</style>
</head>
<body>
<div id="app"><div class="hero"><div class="wrap"><div><h1>Okuma Halkası</h1><p>Yükleniyor…</p></div></div></div></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
